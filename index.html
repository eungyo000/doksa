<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문학 시험 대비 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">>
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1f1d1a; --sub:#6b665e; --line:#e4ded3;
  --accent:#3a5a8c; --accent-soft:#e3eaf5; --p:#8a5a2b; --p-soft:#f4e9dc;
  --s:#3d6b57; --s-soft:#e2efe8; --c:#6a4c8c; --c-soft:#ece5f4;
  --ok:#2f7d4f; --ok-soft:#e1f2e7; --bad:#b4413a; --bad-soft:#f8e3e1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171614; --card:#22201d; --ink:#ece8e1; --sub:#a39d93; --line:#3a3631;
  --accent:#8fb0e3; --accent-soft:#263346; --p:#e0b080; --p-soft:#3a2d20;
  --s:#8fceb0; --s-soft:#21362c; --c:#c4a8e6; --c-soft:#30263d;
  --ok:#7fd4a0; --ok-soft:#1e3528; --bad:#f0948c; --bad-soft:#3e2423;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#171614; --card:#22201d; --ink:#ece8e1; --sub:#a39d93; --line:#3a3631;
  --accent:#8fb0e3; --accent-soft:#263346; --p:#e0b080; --p-soft:#3a2d20;
  --s:#8fceb0; --s-soft:#21362c; --c:#c4a8e6; --c-soft:#30263d;
  --ok:#7fd4a0; --ok-soft:#1e3528; --bad:#f0948c; --bad-soft:#3e2423;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink); font-family:"Gowun Dodum",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;font-weight:900;margin:8px 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 20px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 10px;letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip small{opacity:.7;margin-left:4px}
.work{flex:1;min-width:150px;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:14px;font:inherit;cursor:pointer}
.work b{display:block;font-size:17px}
.work span{font-size:13px;color:var(--sub)}
.work.on.p{border-color:var(--p);background:var(--p-soft)}
.work.on.s{border-color:var(--s);background:var(--s-soft)}
.work.on.c{border-color:var(--c);background:var(--c-soft)}
.secgroup{margin-top:14px}
.secgroup h4{margin:0 0 8px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-right:6px}
.tag.p{background:var(--p-soft);color:var(--p)} .tag.s{background:var(--s-soft);color:var(--s)} .tag.c{background:var(--c-soft);color:var(--c)}
.tag.t{background:var(--accent-soft);color:var(--accent)}
.q{font-size:18px;font-weight:700;margin:14px 0 18px;white-space:pre-line;word-break:keep-all}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer;word-break:keep-all}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .opt{justify-content:center;font-size:30px;font-weight:900;padding:18px}
input.sa{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input.sa:focus{outline:none;border-color:var(--accent)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:15px;word-break:keep-all}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b.h{display:block;font-size:16px;margin-bottom:4px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.fb .ans{font-weight:700}
.fb .ex{margin-top:6px;color:var(--ink)}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px}
.big{font-size:48px;font-weight:900;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.wrong{border-top:1px solid var(--line);padding:12px 0;font-size:14px;word-break:keep-all}
.wrong .wq{font-weight:700;white-space:pre-line}
.wrong .wa{color:var(--ok);margin-top:4px}
.hint{font-size:12px;color:var(--sub);margin-top:14px;text-align:center}
.hidden{display:none}
.theme{position:fixed;top:12px;right:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<button class="theme" id="themeBtn" title="테마 전환">◐</button>
<div class="wrap">

<!-- 홈 -->
<section id="home">
  <h1>문학 시험 대비 퀴즈</h1>
  <p class="lead">이강백 「파수꾼」 · 이청준 「소문의 벽」 — 학습 가이드 전 범위</p>

  <div class="card">
    <p class="label">작품 선택</p>
    <div class="row" id="works"></div>
    <div id="secs"></div>
  </div>

  <div class="card">
    <p class="label">문제 유형</p>
    <div class="row" id="types"></div>
    <p class="label" style="margin-top:16px">출제 순서</p>
    <div class="row" id="orders"></div>
  </div>

  <div class="stack">
    <button class="btn block" id="startBtn">시작하기</button>
    <button class="btn ghost block" id="wrongBtn">오답 노트로 다시 풀기</button>
    <button class="link" id="resetWrong">오답 기록 초기화</button>
  </div>
</section>

<!-- 퀴즈 -->
<section id="quiz" class="hidden">
  <div class="top">
    <button class="link" id="quitBtn">← 그만하기</button>
    <span id="prog" style="font-weight:700"></span>
    <span id="scoreNow" style="color:var(--sub);font-size:14px"></span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card">
    <div id="tags"></div>
    <div class="q" id="qText"></div>
    <div id="answerArea"></div>
    <div id="fb"></div>
  </div>
  <button class="btn block hidden" id="nextBtn">다음 문제</button>
  <p class="hint">단축키: 객관식 1–5 · OX는 O / X · 다음은 Enter</p>
</section>

<!-- 결과 -->
<section id="result" class="hidden">
  <div class="card" style="text-align:center">
    <p class="label">결과</p>
    <p class="big" id="resPct"></p>
    <p id="resTxt" style="margin:4px 0 0;color:var(--sub)"></p>
  </div>
  <div class="card">
    <p class="label">단원별 정답률</p>
    <table id="resTable"></table>
  </div>
  <div class="stack" style="margin-bottom:16px">
    <button class="btn block" id="retryWrong">이번에 틀린 문제만 다시</button>
    <button class="btn ghost block" id="homeBtn">처음으로</button>
  </div>
  <div class="card" id="wrongCard">
    <p class="label">틀린 문제 정리</p>
    <div id="wrongList"></div>
  </div>
</section>
</div>

<script>
/* ============================================================
   문제 데이터
   t: mc(객관식, o[0]이 정답 — 화면에서는 섞여서 나옴)
      ox(a: true/false)
      sa(단답형, a: 인정 답안 배열 — 띄어쓰기·따옴표 무시)
   e: 해설
   ============================================================ */
const SEC = {
  p1:["p","파수꾼","1. 작품 개요·등장인물"],
  p2:["p","파수꾼","2. 희곡의 기본 개념"],
  p3:["p","파수꾼","3. 줄거리·구성"],
  p4:["p","파수꾼","4. 상징적 의미"],
  p5:["p","파수꾼","5. 표현 방식과 효과"],
  p6:["p","파수꾼","6. 시대적 배경·주제 의식"],
  s1:["s","소문의 벽","1. 작품 개요·핵심 인물"],
  s2:["s","소문의 벽","2. 전체 줄거리"],
  s3:["s","소문의 벽","3. 박준의 세 소설"],
  s4:["s","소문의 벽","4. 전짓불 트라우마·광기"],
  s5:["s","소문의 벽","5. ‘소문의 벽’의 사회적 의미"],
  s6:["s","소문의 벽","6. 김 박사 vs ‘나’"],
  c1:["c","두 작품 비교","비교 문제"]
};

const DATA = {
p1:[
{t:"sa",q:"「파수꾼」의 작가는?",a:["이강백"]},
{t:"mc",q:"「파수꾼」의 갈래로 적절하지 않은 것은?",o:["액자 소설","희곡","단막극","우화극(알레고리극)"],e:"「파수꾼」은 희곡·단막극·우화극(알레고리극). 액자 소설은 「소문의 벽」의 서사 구조다."},
{t:"sa",q:"「파수꾼」의 시대 배경: 1970년대 ○○ 체제기",a:["유신"]},
{t:"mc",q:"「파수꾼」 작품 속 시공간은?",o:["특정되지 않은 황야의 망루와 마을","6·25 전쟁 당시의 농촌 마을","1970년대 서울의 하숙집 골목","바닷가 등대와 어촌 마을"]},
{t:"mc",q:"「파수꾼」의 핵심 주제로 가장 적절한 것은?",o:["허구의 적(이리 떼)을 만들어 공포로 사회를 통제하는 권력의 기만성과, 진실이 권력에 의해 은폐·왜곡되는 과정","자연의 위협에 맞서 공동체가 단결하는 과정","세대 간 갈등과 화해","전쟁 트라우마로 인한 지식인의 광기"]},
{t:"ox",q:"「파수꾼」은 인물을 고유한 이름 대신 ‘가·나·다’라는 기호로 부른다.",a:true},
{t:"ox",q:"「파수꾼」은 마지막 장면에서 관객을 ‘마을 사람’으로 끌어들인다.",a:true},
{t:"ox",q:"「파수꾼」은 현실을 직접적으로 고발하는 사실주의극이다.",a:false,e:"사건을 우화로 꾸며 현실을 간접적으로 비판하는 우화극이다."},
{t:"sa",q:"망루에 올라 이리 떼는 없고 흰 구름뿐임을 발견한 소년 파수꾼은? (가/나/다)",a:["다","파수꾼다"]},
{t:"sa",q:"망루 맨 위에서 이리 떼를 감시하고 외치는 늙은 파수꾼은? (가/나/다)",a:["가","파수꾼가"]},
{t:"sa",q:"망루 아래에서 평생 양철 북을 두드리며 덫으로 이리를 잡으려 하는 파수꾼은? (가/나/다)",a:["나","파수꾼나"]},
{t:"mc",q:"‘다’가 흰 구름의 진실을 편지로 알린 대상은?",o:["촌장","운반인","마을 사람들","파수꾼 ‘가’"],e:"편지를 운반인을 통해 촌장에게 보냈다(진실을 권력자에게 먼저 알리려는 순진한 믿음)."},
{t:"mc",q:"새로 파견된 ‘다’에게 이리와 파수꾼의 숭고함을 가르친 인물은?",o:["파수꾼 ‘나’","파수꾼 ‘가’","촌장","운반인"]},
{t:"mc",q:"‘이리 떼가 없다는 진실을 알면서도 밝히지 않음. 비밀을 독점하며 진실을 은폐하는 침묵하는 공범, 권력 구조 유지에 적극 기여’에 해당하는 인물은?",o:["파수꾼 ‘가’","파수꾼 ‘나’","파수꾼 ‘다’","운반인"]},
{t:"mc",q:"‘권력 구조를 잘못 이해하고 맹신하는 순응적 존재, 교육을 통해 개인을 체제의 일부로 길들이는 역할’에 해당하는 인물은?",o:["파수꾼 ‘나’","파수꾼 ‘가’","촌장","마을 사람들"]},
{t:"mc",q:"‘진실을 발견한 유일한 인물이지만 가장 나약한 존재. 권력의 속성을 깨닫지 못해 결국 진실을 알고도 침묵하는 공범이 됨’에 해당하는 인물은?",o:["파수꾼 ‘다’","파수꾼 ‘가’","파수꾼 ‘나’","운반인"]},
{t:"mc",q:"‘허상의 공포를 통치 수단으로 삼는 교활한 권력자’는?",o:["촌장","파수꾼 ‘가’","운반인","파수꾼 ‘나’"]},
{t:"mc",q:"‘진실 여부보다 자기 이익을 앞세우는 이해타산적·기회주의적 인물, 공포 체제 속에서도 사리사욕을 채우는 대중’은?",o:["운반인","파수꾼 ‘나’","마을 사람들","촌장"]},
{t:"mc",q:"‘눈앞의 사건에만 반응할 뿐 원인을 사유하지 않는 군중. 권력이 만든 공포에 휘둘리며 그 공포를 함께 유지함’은?",o:["마을 사람들(관객)","운반인","파수꾼 ‘나’","파수꾼 ‘다’"]},
{t:"sa",q:"촌장은 공포가 마을을 ‘○○’시키고 ‘○○’를 지킨다고 정당화한다. (두 단어를 순서대로)",a:["단결질서","단결시키고질서"]},
{t:"mc",q:"촌장이 ‘다’를 굴복시킨 방식은?",o:["부드러운 회유와 협박","폭력과 감금","돈으로 매수","공개 토론을 통한 논리적 설득"]},
{t:"ox",q:"운반인은 이리를 전혀 두려워하지 않는 대담한 인물이다.",a:false,e:"이리 껍질을 뒤집어쓰고 다닐 만큼 이리를 두려워한다. 그러면서도 공포 상황을 자기 이익에 이용할 줄 안다."},
{t:"mc",q:"운반인이 이리를 몹시 두려워한다는 것을 보여 주는 행동은?",o:["이리 껍질을 뒤집어쓰고 다님","밤마다 양철 북을 두드림","망루 위에 올라가지 않음","덫을 여러 개 놓음"]},
{t:"ox",q:"운반인은 ‘다’의 편지를 거리낌 없이 읽고 퍼뜨려 분란을 부추긴다.",a:true},
{t:"mc",q:"‘다’가 “이리 떼가 몰려온다!”고 외친 뒤 마을 사람들의 반응은?",o:["의심 없이 수긍하고 오히려 운반인을 처벌하려 함","촌장에게 속았음을 깨닫고 망루를 부숨","‘다’를 거짓말쟁이로 몰아 쫓아냄","흰 구름을 확인하러 망루로 올라감"]},
{t:"ox",q:"무대에서는 관객석이 마을 사람들의 자리가 된다.",a:true},
{t:"mc",q:"결말에서 촌장이 ‘다’에게 한 말과 ‘다’의 반응은?",o:["마을로 돌아오지 말라 하자 ‘다’는 침묵함","내일 함께 흰 구름을 외치자 하자 ‘다’는 기뻐함","망루를 떠나라 하자 ‘다’는 마을로 돌아감","편지를 다시 쓰라 하자 ‘다’는 거절함"]}
],
p2:[
{t:"mc",q:"소설과 비교한 희곡의 전달 방식으로 옳은 것은?",o:["서술자가 없고, 대사와 행동으로만 사건을 제시한다","서술자가 사건에 개입해 설명·요약·평가한다","서술자가 인물의 내면을 직접 설명한다","주로 과거형으로 서술한다"]},
{t:"sa",q:"소설은 말하기(telling)의 문학, 희곡은 ○○ ○○(showing)의 문학이다.",a:["보여주기"]},
{t:"mc",q:"희곡의 시제는?",o:["모든 사건이 관객 눈앞에서 현재형으로 진행된다","주로 과거형으로 서술된다","미래형으로 예고된다","과거와 현재를 자유롭게 오간다"],e:"소설은 주로 과거형, 희곡은 현재형."},
{t:"mc",q:"희곡에서 인물의 심리는 어떻게 제시되는가?",o:["대사, 지시문, 행동, 말투의 변화를 통해 관객이 스스로 읽어 내야 한다","서술자가 내면을 직접 설명한다","해설에서 모든 인물의 심리를 미리 밝힌다","작가의 주석으로 설명한다"]},
{t:"ox",q:"희곡은 무대라는 한정된 공간과 상연 시간의 제약을 받는다.",a:true,e:"소설은 배경을 자유롭게 옮기고 긴 시간을 펼칠 수 있다."},
{t:"mc",q:"관객이 같은 시간, 같은 공간에서 사건을 함께 지켜본다는 희곡의 수용 조건 덕분에 가능한 것은?",o:["무대와 객석의 경계를 흔드는 실험","서술자의 자유로운 개입","배경의 자유로운 이동","독자마다 다른 시간에 감상하는 것"]},
{t:"mc",q:"희곡은 ‘갈등의 문학’이다. 「파수꾼」의 중심 갈등은?",o:["진실을 외치려는 ‘다’와 이를 막으려는 촌장의 갈등","‘가’와 ‘나’의 갈등","운반인과 마을 사람들의 갈등","인간과 이리 떼의 갈등"]},
{t:"sa",q:"서술자가 없는 희곡이 인물의 내면을 전달하기 위해 마련한 고유한 장치 두 가지는?",a:["독백방백","방백독백","독백과방백","방백과독백"]},
{t:"mc",q:"‘해설’의 개념은?",o:["막이 오르기 전 등장인물, 무대, 시간과 공간 등을 설명하는 부분","대사 앞뒤 괄호 속에서 인물의 동작을 지시하는 글","상대역 없이 홀로 하는 말","관객에게만 건네는 말"],e:"「파수꾼」에서는 황야에 세워진 망루, 파수꾼들의 위치 등 무대 상황을 제시한다."},
{t:"mc",q:"“파수꾼 ‘나’는 신이 나서 양철 북을 두드린다. 북소리, 한동안 계속된다.”는 희곡의 어떤 요소인가?",o:["무대 지시문","동작 지시문","해설","방백"],e:"무대 지시문: 무대 장치, 조명, 음향, 등장·퇴장을 지시하는 글."},
{t:"mc",q:"(은밀한 목소리로), (창백해지며)처럼 대사 앞뒤 괄호 속에서 인물의 동작·표정·말투·심리를 지시하는 글은?",o:["동작 지시문","무대 지시문","해설","독백"]},
{t:"sa",q:"상대역 없이 인물이 홀로 자신의 속내를 토로하는 말은?",a:["독백"]},
{t:"sa",q:"무대 위 다른 인물에게는 들리지 않는다는 약속 아래 관객에게만 건네는 말은?",a:["방백"]},
{t:"mc",q:"방백의 효과로 가장 적절한 것은?",o:["관객만 인물의 속마음을 알게 하여 극적 아이러니를 만든다","무대 장치를 바꾸는 신호가 된다","인물 간의 갈등을 직접 해소한다","막과 막을 구분한다"]},
{t:"mc",q:"촌장의 지시문 (은밀한 목소리로)가 보여 주는 것은?",o:["공개적으로는 할 수 없는 회유를 시작함 — 권력의 이중성","진실을 의심받아 동요함","외치기 직전의 극심한 내적 갈등","반복된 질문으로 드러나는 불안"]},
{t:"mc",q:"(창백해지며) “그건, 그건 아니에요!”가 보여 주는 ‘다’의 심리는?",o:["진실에 대한 믿음을 의심받자 동요함","촌장의 약속을 믿고 안도함","이리 떼에 대한 공포","마을 사람들에 대한 분노"]},
{t:"mc",q:"“꼭 약속하시는 거죠?” / “정말이죠, 정말?”이 드러내는 ‘다’의 심리는?",o:["반복된 확인 질문으로 드러나는 불안","촌장에 대한 확고한 신뢰","진실을 밝히겠다는 결의","운반인에 대한 의심"]},
{t:"mc",q:"‘쓰러질 것 같은 걸음으로 망루를 향해 걸어간다 / 긴 침묵’이 드러내는 것은?",o:["외치기 직전의 극심한 내적 갈등","권력의 이중성","이리 떼를 직접 본 충격","승리감과 안도"]},
{t:"mc",q:"막(幕)에 대한 설명과 「파수꾼」의 구성으로 옳은 것은?",o:["막이 오르고 내리는 것을 경계로 하는 큰 단위 — 「파수꾼」은 막이 하나인 단막극","배경이나 인물이 바뀌는 작은 단위 — 「파수꾼」은 3막극","배경이나 인물이 바뀌는 작은 단위 — 「파수꾼」은 단막극","막이 오르고 내리는 큰 단위 — 「파수꾼」은 5막극"]},
{t:"mc",q:"장(場)의 개념은?",o:["막 안에서 배경이나 등장인물이 바뀌는 작은 단위","막이 오르고 내리는 것을 경계로 하는 큰 단위","막이 오르기 전의 설명","갈등이 최고조에 이르는 단계"]},
{t:"mc",q:"희곡 5단 구성의 순서로 옳은 것은?",o:["발단 → 전개 → 절정 → 하강 → 대단원","발단 → 전개 → 위기 → 절정 → 결말","발단 → 절정 → 전개 → 하강 → 대단원","전개 → 발단 → 절정 → 대단원 → 하강"]},
{t:"sa",q:"배우가 관객에게 말을 걸거나 관객을 극 속 인물로 끌어들이는 연출(무대와 객석의 경계 허물기)을 ‘제○의 벽 깨기’라고 한다. ○에 들어갈 숫자는?",a:["4","넷","사"]},
{t:"sa",q:"촌장이 관객을 향해 하는 말: “어서 오십시오, ○○ ○○○”",a:["주민여러분"]},
{t:"mc",q:"관객 호명 장면에서 ‘관객석 쪽으로 돌아서다가’ 놀라는 인물은?",o:["파수꾼 ‘나’","파수꾼 ‘다’","운반인","파수꾼 ‘가’"]},
{t:"mc",q:"관객 호명을 통한 관객의 위치 변화로 옳은 것은?",o:["무대 밖의 구경꾼 → 극 속 인물인 ‘마을 사람’(군중)","극 속 인물 → 무대 밖의 구경꾼","마을 사람 → 파수꾼","구경꾼 → 촌장의 편"],e:"관객은 ‘다’가 거짓을 외치도록 만든 압력의 일부가 된다."},
{t:"mc",q:"「파수꾼」의 관객 호명이 관객에게 주는 효과로 적절하지 않은 것은?",o:["극과 심리적 거리를 두고 객관적으로 관망하게 함","몰입과 현장감","심리적 압박의 체험","당혹감과 자기 발견"],e:"효과 4가지: 몰입과 현장감 / 심리적 압박의 체험 / 당혹감과 자기 발견 / 성찰과 현실 인식."},
{t:"mc",q:"‘극 속 마을 사람으로 호명되어 사건 한가운데에 서게 되고, 망루 위 ‘다’의 긴장과 망설임을 바로 앞에서 함께 겪는다’ — 어떤 효과인가?",o:["몰입과 현장감","심리적 압박의 체험","당혹감과 자기 발견","성찰과 현실 인식"]},
{t:"mc",q:"‘다’가 진실을 외치지 못하는 이유가 바로 ‘우리’(마을 사람들)의 시선과 분노라는 사실을 당사자로서 느끼게 된다 — 어떤 효과인가?",o:["심리적 압박의 체험","몰입과 현장감","당혹감과 자기 발견","성찰과 현실 인식"]},
{t:"mc",q:"‘다’가 “이리 떼가 몰려온다!”고 외치는 순간, 관객이 자신도 진실을 가로막은 군중의 일부(허위 재생산의 공모자)였음을 깨닫는다 — 어떤 효과인가?",o:["당혹감과 자기 발견","몰입과 현장감","심리적 압박의 체험","성찰과 현실 인식"]},
{t:"mc",q:"극을 남의 이야기로 구경하고 끝내지 못하게 하여, 극장 밖 현실에서 자신이 공포와 거짓에 어떻게 반응해 왔는지 돌아보고 사회 구조를 비판적으로 생각하게 한다 — 어떤 효과인가?",o:["성찰과 현실 인식","몰입과 현장감","심리적 압박의 체험","당혹감과 자기 발견"]},
{t:"mc",q:"우화극(알레고리극)의 정의는?",o:["동물, 사물, 가상의 상황을 내세워 현실의 문제를 간접적으로 풍자·비판하는 극","실제 역사적 사건을 그대로 재현하는 극","막이 하나뿐인 극","관객이 직접 무대에 올라 참여하는 극"],e:"「파수꾼」은 이리 떼와 망루라는 가상의 상황으로 공포 정치를 비판한다."}
],
p3:[
{t:"ox",q:"‘나’가 놓은 덫에는 가끔 이리가 걸린다.",a:false,e:"덫에는 늘 나뭇가지뿐이다."},
{t:"mc",q:"마을 사람들이 살아가는 상황은?",o:["이리 떼의 공포 속에서 살아감","이리 떼를 모두 물리치고 평화롭게 살아감","이리 떼가 없다는 것을 알고 있음","망루를 직접 지키며 살아감"]},
{t:"mc",q:"‘다’가 망루 위에 올라가 알게 된 사실은?",o:["이리 떼는 없고 흰 구름뿐이다","이리 떼가 마을 바로 앞까지 와 있다","‘가’가 망루에서 잠만 잔다","망루가 무너지기 직전이다"]},
{t:"mc",q:"‘다’가 진실을 알린 방법은?",o:["편지에 써서 운반인을 통해 촌장에게 보냄","마을로 내려가 직접 외침","양철 북을 두드려 알림","‘가’에게 대신 외쳐 달라고 부탁함"]},
{t:"sa",q:"운반인이 편지를 읽고 퍼뜨려 구호가 된 말: “이리 떼는 없고, ○ ○○뿐.”",a:["흰구름"]},
{t:"mc",q:"성난 마을 사람들이 들고 온 것과 그 목적은?",o:["도끼 — 망루를 부수려고","횃불 — 이리 떼를 쫓으려고","편지 — 촌장에게 항의하려고","양철 북 — 함께 외치려고"]},
{t:"ox",q:"촌장은 이리 떼가 처음부터 없었다는 사실을 끝까지 부인한다.",a:false,e:"촌장은 이리 떼가 처음부터 없었다고 인정하면서도 공포를 유지하려 한다."},
{t:"mc",q:"촌장이 이리 떼의 부재를 인정하며 펼친 논리는?",o:["없는 것을 두려워하는 게 무엇이 나쁘냐, 공포가 마을을 단결시킨다","이리 떼는 언젠가 반드시 올 것이다","흰 구름도 사실은 이리 떼의 일종이다","파수꾼들이 거짓말을 했으니 처벌해야 한다"]},
{t:"mc",q:"촌장이 ‘다’를 협박한 내용은?",o:["흰 구름을 외치면 ‘다’ 자신이 죽게 될 것이다","망루에서 영원히 내려오지 못할 것이다","가족을 마을에서 쫓아낼 것이다","편지를 운반인이 퍼뜨린 책임을 지게 될 것이다"]},
{t:"mc",q:"촌장이 ‘다’를 회유한 방법은?",o:["내일 함께 흰 구름이라 외치겠다고 약속함","촌장 자리를 물려주겠다고 함","딸기를 나눠 주겠다고 함","‘가’ 대신 망루 맨 위를 맡기겠다고 함"]},
{t:"sa",q:"‘다’의 마지막 외침: “이리 떼다, 이리 떼! 이리 떼가 ○○○○!”",a:["몰려온다"]},
{t:"mc",q:"‘다’가 외친 직후 ‘가’와 ‘나’의 행동은?",o:["‘가’는 손을 들어 함께 외치고, ‘나’는 신이 나서 양철 북을 두드림","‘가’는 침묵하고, ‘나’는 덫을 놓으러 감","‘가’는 망루에서 내려오고, ‘나’는 ‘다’를 꾸짖음","둘 다 마을로 도망감"]},
{t:"mc",q:"다음을 줄거리 순서대로 바르게 배열한 것은?\nㄱ. ‘다’가 흰 구름을 발견함\nㄴ. ‘다’가 관객 앞에서 “이리 떼가 몰려온다!”고 외침\nㄷ. 촌장이 ‘다’를 회유하고 협박함\nㄹ. ‘다’가 ‘나’에게서 파수꾼의 숭고함을 배움\nㅁ. 운반인이 편지 내용을 퍼뜨림",o:["ㄹ → ㄱ → ㅁ → ㄷ → ㄴ","ㄱ → ㄹ → ㅁ → ㄷ → ㄴ","ㄹ → ㄱ → ㄷ → ㅁ → ㄴ","ㄹ → ㅁ → ㄱ → ㄷ → ㄴ"]},
{t:"mc",q:"결말에서 ‘다’의 최종 처지는?",o:["‘가’, ‘나’처럼 망루를 지키며 진실을 알고도 침묵하는 공범이 됨","마을로 돌아가 진실을 밝힘","운반인과 함께 처벌받음","촌장이 되어 마을을 다스림"]},
{t:"ox",q:"공포 체제는 ‘다’의 외침으로 무너지지 않고 계속된다.",a:true}
],
p4:[
{t:"mc",q:"‘이리 떼’의 상징적 의미는?",o:["권력이 통치를 위해 만들어 낸 허구의 적, 조작된 공포","이리 떼라는 허구 뒤에 가려진 진실","진실을 알게 된 민중의 분노와 저항","끝없이 유예되는 기만적 약속"],e:"사람들을 결속시키고 복종하게 만드는 수단이다."},
{t:"mc",q:"‘흰 구름’의 상징적 의미는?",o:["이리 떼라는 허구 뒤에 가려진 진실, 순수하고 아름다운 현실","공포를 퍼뜨리는 선전 도구","권력자가 독점하는 이익","익명적·보편적 존재"]},
{t:"mc",q:"‘망루’의 상징적 의미는?",o:["진실을 볼 수 있는 자리이자, 공포를 생산·관리하는 감시와 통제의 장치","민중의 분노와 저항","진실 전달의 통로","실체 없는 적을 잡으려는 헛된 노력"],e:"오직 파수꾼만 올라갈 수 있다."},
{t:"mc",q:"‘양철 북’의 상징적 의미는?",o:["공포를 퍼뜨리고 증폭시키는 선전·여론 조작의 도구","진실을 알리는 경고음","민중의 저항","진실을 권력자에게 먼저 알리려는 순진한 믿음"]},
{t:"mc",q:"‘이리 떼 팻말과 딸기’의 상징적 의미는?",o:["공포로 사람들의 접근을 막고 그 이익(딸기)은 권력자가 독점함 — 공포 정치의 실체","순수하고 아름다운 현실","몰개성화된 개인","권력자에게 진실을 알리는 통로"]},
{t:"sa",q:"“이리 떼를 주의하라는 팻말 밑엔 으레 잘 익은 ○○가 가득” — ○○는?",a:["딸기"]},
{t:"mc",q:"‘덫’의 상징적 의미는?",o:["실체 없는 적을 잡으려는 헛된 노력. 비어 있어도 이리가 교활해서라고 여기며 공포를 유지하는 장치","진실을 알게 된 민중의 분노","공포를 퍼뜨리는 선전 도구","진실을 볼 수 있는 자리"]},
{t:"sa",q:"“또 헛쳤다. 교활한 짐승도 다 있지.”라는 대사와 관련된 소재는?",a:["덫"]},
{t:"mc",q:"‘도끼’의 상징적 의미는?",o:["진실을 알게 된 민중의 분노와 저항","권력자의 폭력","허구의 적","감시와 통제의 장치"]},
{t:"mc",q:"‘편지’의 상징적 의미는?",o:["진실을 권력자에게 먼저 알리려는 순진한 믿음, 진실 전달의 통로","진실을 흥밋거리로 삼는 기회주의","선전·여론 조작의 도구","끝없이 유예되는 약속"]},
{t:"mc",q:"상징으로서 ‘운반인’의 의미는?",o:["진실조차 흥밋거리나 이용 거리로 삼는 이해타산적 기회주의자","진실을 볼 수 있는 유일한 존재","권력에 맞서는 저항자","공포를 생산하는 권력자"]},
{t:"sa",q:"촌장이 “○○은 너를 따라 흰 구름이라 외칠 테니”라고 약속한다. 끝없이 유예되는 기만적 약속을 상징하는 이 말은?",a:["내일"]},
{t:"mc",q:"촌장의 약속 속 ‘내일’의 상징적 의미는?",o:["끝없이 유예되는 기만적 약속, 진실 공개를 미루는 권력의 화법","희망찬 미래","진실이 밝혀질 날","파수꾼 교대일"]},
{t:"mc",q:"인물을 ‘가·나·다’라는 이름으로 부르는 것의 상징적 의미는?",o:["누구나 될 수 있는 익명적·보편적 존재, 체제 속 개인의 몰개성화","인물 간의 서열","작가의 실제 지인","인물의 나이 순서"]},
{t:"sa",q:"선전·여론 조작의 도구를 상징하는 소재는?",a:["양철북","북"]},
{t:"sa",q:"‘다’가 망루에서 본 “아름다운 것”으로, 진실을 상징하는 소재는?",a:["흰구름"]},
{t:"mc",q:"상징의 관계 구조로 옳은 것은?",o:["촌장(권력) → 망루·파수꾼·양철 북·팻말(공포 유지 장치) → 마을 사람들(민중 = 관객)","마을 사람들 → 촌장 → 망루","망루 → 촌장 → 운반인","파수꾼 → 마을 사람들 → 촌장"],e:"촌장이 허구의 적을 만들고 → 장치가 공포를 생산·확산하고 → 마을 사람들은 두려워하며 복종한다."},
{t:"ox",q:"흰 구름(진실)은 마을 어디에서나 볼 수 있다.",a:false,e:"흰 구름은 망루 위에서만 보인다."},
{t:"mc",q:"「파수꾼」 상징 구조의 핵심으로 옳은 것은?",o:["진실이 공포 체제에 흡수되어 체제를 오히려 강화하는 구조","진실이 공포 체제를 무너뜨리는 구조","권력자와 민중이 화해하는 구조","공포가 점점 약해지는 구조"],e:"흰 구름을 본 ‘다’의 외침이 촌장의 회유로 다시 이리 떼의 외침으로 바뀐다."}
],
p5:[
{t:"mc",q:"우화적 기법(알레고리)의 효과는?",o:["현실을 직접 언급하지 않고 간접 비판하여 검열을 피하고, 특정 시대를 넘는 보편성을 획득함","사건을 사실적으로 재현해 현장감을 높임","인물의 내면을 서술자가 직접 설명함","관객을 무대 위로 올림"]},
{t:"sa",q:"현실을 직접 언급하지 않고 동물·사물·가상의 상황으로 간접적으로 비판하는 기법은?",a:["우화","알레고리","우화적기법","우의적기법","우의"]},
{t:"mc",q:"인물의 기호화(‘가·나·다’)의 효과는?",o:["고유한 이름이 없는 익명의 존재로 제시하여, 관객 누구나 그 자리에 설 수 있음을 암시함","인물 간 갈등을 줄임","인물의 나이를 드러냄","청각적 효과를 줌"]},
{t:"mc",q:"「파수꾼」의 반어(아이러니)에 해당하는 것은?",o:["진실을 본 ‘다’가 오히려 “이리 떼가 몰려온다!”고 외침","‘나’가 양철 북을 두드림","운반인이 식량을 나름","‘가’가 망루 맨 위에 있음"],e:"다정한 촌장이 실은 기만적 권력자라는 점도 반어다. 진실이 권력에 의해 뒤집히는 비극을 선명하게 드러낸다."},
{t:"mc",q:"“이리 떼는 없고, 흰 구름뿐.”이 구호처럼 반복되는 것의 효과는?",o:["진실이 대중의 구호가 되는 과정을 보여 줌","‘다’의 결의를 강조함","촌장의 권위를 드러냄","청각적으로 공포를 확산함"]},

{t:"mc",q:"(은밀한 목소리로), (창백해지며), 쓰러질 것 같은 걸음, 긴 침묵 — 이런 표현 방식의 효과는?",o:["서술자 없이 인물의 내면 갈등과 긴장을 관객이 직접 읽어 내게 함","현실을 간접적으로 비판해 검열을 피함","관객을 극 속 인물로 끌어들임","비극적 여운을 청각적으로 남김"]},
{t:"mc",q:"양철 북소리가 한동안 계속되는 청각적 효과는?",o:["공포가 다시 마을을 뒤덮는 분위기를 감각적으로 전달하고 비극적 여운을 남김","이리 떼가 실제로 왔음을 알림","희망찬 분위기를 조성함","장면 전환을 알림"]},
{t:"mc",q:"관객 호명(무대와 객석의 경계 허물기)의 효과로 옳은 것은?",o:["현장감과 몰입이 커지고, 자신이 ‘다’에게 거짓을 외치게 한 군중의 일부임을 깨달아 스스로를 성찰하게 됨","관객이 극과 거리를 두고 객관적으로 판단하게 됨","검열을 피하게 됨","인물의 몰개성화를 보여 줌"]},
{t:"mc",q:"비극적·열린 결말의 효과는?",o:["문제를 해결해 주지 않음으로써 관객에게 판단과 성찰의 몫을 넘김","권선징악의 교훈을 줌","진실의 승리를 보여 줌","인물 간 화해를 보여 줌"]},
{t:"ox",q:"「파수꾼」은 진실이 밝혀지며 공포 체제가 무너지는 닫힌 결말이다.",a:false,e:"진실은 묻히고 공포 체제가 계속되는 비극적·열린 결말이다."}
],
p6:[
{t:"mc",q:"「파수꾼」이 쓰인 시기의 상황은?",o:["1970년대 초반, 수많은 희곡과 공연이 정부의 검열을 받던 시기","1950년대 6·25 전쟁 중","1980년대 민주화 운동 직후","1990년대 외환 위기 시기"]},

{t:"mc",q:"‘진실의 은폐와 왜곡’에 대한 설명으로 옳은 것은?",o:["진실(흰 구름)은 권력자에게 먼저 전달되는 순간 ‘관리’의 대상이 되고 결국 공개되지 못한다","진실은 마을 사람들에 의해 공개된다","진실은 처음부터 모두가 알고 있었다","진실은 운반인이 끝까지 지킨다"]},

{t:"mc",q:"관객을 마을 사람으로 부름으로써 던지는 질문은?",o:["거짓을 강요하는 군중 속에 우리 자신도 서 있지 않은가","이리 떼는 정말 존재하는가","촌장은 누구를 모델로 했는가","파수꾼은 몇 명이 적당한가"]}

/* ============================================================ */
const Q = [];
for (const s in DATA) DATA[s].forEach((x,i)=>Q.push(Object.assign({id:s+"-"+i,s},x)));

const LS="litquiz_wrong_v1";
function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){return new Set()}}
function saveWrong(set){try{localStorage.setItem(LS,JSON.stringify([...set]))}catch(e){}}
let wrongSet=loadWrong();

const $=id=>document.getElementById(id);
const norm=s=>String(s).toLowerCase().replace(/[\s'"‘’“”「」『』.,!?~·()\[\]\-:;…]/g,"");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TYPE={mc:"객관식",ox:"OX",sa:"단답형"};

/* ---------- 홈 화면 설정 ---------- */
const state={works:new Set(["p","s","c"]),secs:new Set(Object.keys(SEC)),types:new Set(["mc","ox","sa"]),order:"random"};

function renderHome(){
  const W=[["p","파수꾼","이강백 · 희곡"],["s","소문의 벽","이청준 · 소설"],["c","두 작품 비교","보너스"]];
  $("works").innerHTML=W.map(([k,n,d])=>`<button class="work ${k} ${state.works.has(k)?"on":""}" data-w="${k}"><b>${n}</b><span>${d} · ${Q.filter(q=>SEC[q.s][0]===k).length}문항</span></button>`).join("");
  let h="";
  for(const [k,n] of [["p","파수꾼"],["s","소문의 벽"]]){
    if(!state.works.has(k))continue;
    h+=`<div class="secgroup"><h4>「${n}」 단원</h4><div class="row">`;
    for(const s in SEC){ if(SEC[s][0]!==k)continue;
      h+=`<button class="chip ${state.secs.has(s)?"on":""}" data-s="${s}">${SEC[s][2]}<small>${DATA[s].length}</small></button>`;}
    h+=`</div></div>`;
  }
  $("secs").innerHTML=h;
  $("types").innerHTML=Object.entries(TYPE).map(([k,n])=>`<button class="chip ${state.types.has(k)?"on":""}" data-t="${k}">${n}<small>${Q.filter(q=>q.t===k).length}</small></button>`).join("");
  $("orders").innerHTML=[["random","랜덤"],["seq","단원 순서대로"]].map(([k,n])=>`<button class="chip ${state.order===k?"on":""}" data-o="${k}">${n}</button>`).join("");
  const n=pool().length;
  $("startBtn").textContent=`시작하기 (${n}문항)`; $("startBtn").disabled=!n;
  const wn=Q.filter(q=>wrongSet.has(q.id)).length;
  $("wrongBtn").textContent=`오답 노트로 다시 풀기 (${wn}문항)`; $("wrongBtn").disabled=!wn;
  $("resetWrong").style.display=wn?"":"none";
}
function pool(){return Q.filter(q=>state.works.has(SEC[q.s][0])&&(SEC[q.s][0]==="c"||state.secs.has(q.s))&&state.types.has(q.t))}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.w){const k=b.dataset.w; state.works.has(k)?state.works.delete(k):state.works.add(k); renderHome();}
  else if(b.dataset.s){const k=b.dataset.s; state.secs.has(k)?state.secs.delete(k):state.secs.add(k); renderHome();}
  else if(b.dataset.t){const k=b.dataset.t; state.types.has(k)?state.types.delete(k):state.types.add(k); renderHome();}
  else if(b.dataset.o){state.order=b.dataset.o; renderHome();}
});

/* ---------- 퀴즈 진행 ---------- */
let run=null;
function start(list){
  if(!list.length)return;
  run={list:state.order==="random"?shuffle(list):list.slice(),i:0,right:0,res:[],answered:false};
  show("quiz"); renderQ();
}
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}

function renderQ(){
  const q=run.list[run.i]; run.answered=false; run.cur=q;
  const [w,wn,sn]=SEC[q.s];
  $("prog").textContent=`${run.i+1} / ${run.list.length}`;
  $("scoreNow").textContent=`정답 ${run.right}`;
  $("barFill").style.width=(run.i/run.list.length*100)+"%";
  $("tags").innerHTML=`<span class="tag ${w}">${wn}</span><span class="tag t">${TYPE[q.t]}</span><span style="font-size:12px;color:var(--sub)">${sn}</span>`;
  $("qText").textContent=q.q;
  $("fb").innerHTML=""; $("nextBtn").classList.add("hidden");
  const A=$("answerArea");
  if(q.t==="mc"){
    run.opts=shuffle(q.o.map((t,i)=>({t,c:i===0})));
    A.innerHTML=`<div class="stack">${run.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
    A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerMC(+b.dataset.i));
  }else if(q.t==="ox"){
    A.innerHTML=`<div class="ox"><button class="opt" data-v="1">O</button><button class="opt" data-v="0">X</button></div>`;
    A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerOX(b.dataset.v==="1"));
  }else{
    A.innerHTML=`<input class="sa" id="saIn" placeholder="답을 입력하세요" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn" id="saOk">확인</button><button class="btn ghost" id="saGive">모르겠어요</button></div>`;
    const inp=$("saIn"); setTimeout(()=>inp.focus(),50);
    $("saOk").onclick=()=>answerSA(inp.value);
    $("saGive").onclick=()=>answerSA(null);
    inp.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();ev.stopPropagation();answerSA(inp.value)}};
  }
}
function answerText(q){return q.t==="mc"?q.o[0]:q.t==="ox"?(q.a?"O":"X"):q.a[0]}
function finish(ok,q){
  run.answered=true;
  if(ok){run.right++; wrongSet.delete(q.id)} else wrongSet.add(q.id);
  saveWrong(wrongSet);
  run.res.push({q,ok});
  $("scoreNow").textContent=`정답 ${run.right}`;
  const ans = q.t==="sa" ? q.a[0].replace(/^g/,"G") : answerText(q);
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="h">${ok?"정답!":"오답"}</b>${ok&&q.t==="mc"?"":`<div>정답: <span class="ans">${esc(ans)}</span></div>`}${q.e?`<div class="ex">${esc(q.e)}</div>`:""}</div>`;
  $("nextBtn").classList.remove("hidden");
  $("nextBtn").textContent=run.i+1<run.list.length?"다음 문제":"결과 보기";
}
function answerMC(i){
  if(run.answered)return;
  const btns=$("answerArea").querySelectorAll(".opt");
  btns.forEach((b,j)=>{b.disabled=true; if(run.opts[j].c)b.classList.add("ok"); else if(j===i)b.classList.add("bad");});
  finish(run.opts[i].c,run.cur);
}
function answerOX(v){
  if(run.answered)return;
  const q=run.cur, btns=$("answerArea").querySelectorAll(".opt");
  btns.forEach(b=>{b.disabled=true; const bv=b.dataset.v==="1"; if(bv===q.a)b.classList.add("ok"); else if(bv===v)b.classList.add("bad");});
  finish(v===q.a,q);
}
function answerSA(val){
  if(run.answered)return;
  const q=run.cur;
  const ok= val!==null && val.trim()!=="" && q.a.some(a=>norm(a)===norm(val));
  $("saIn").disabled=true; $("saOk").disabled=true; $("saGive").disabled=true;
  finish(ok,q);
  if(!ok && val && val.trim()){
    const fix=document.createElement("button");
    fix.className="link"; fix.textContent="표현만 다르고 사실 맞았어요 → 정답 처리";
    fix.onclick=()=>{run.right++; wrongSet.delete(q.id); saveWrong(wrongSet); run.res[run.res.length-1].ok=true; $("scoreNow").textContent=`정답 ${run.right}`; fix.remove(); const f=$("fb").querySelector(".fb"); f.className="fb ok"; f.querySelector(".h").textContent="정답 처리됨";};
    $("fb").appendChild(fix);
  }
}
function next(){ if(!run.answered)return; run.i++; run.i<run.list.length?renderQ():renderResult(); }
$("nextBtn").onclick=next;

document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden")||!run)return;
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Enter"){e.preventDefault();next();return}
  if(run.answered)return;
  const q=run.cur;
  if(q.t==="mc"&&/^[1-5]$/.test(e.key)){const i=+e.key-1; if(i<run.opts.length)answerMC(i);}
  if(q.t==="ox"){const k=e.key.toLowerCase(); if(k==="o")answerOX(true); if(k==="x")answerOX(false);}
});

/* ---------- 결과 ---------- */
function renderResult(){
  show("result");
  const n=run.res.length, r=run.res.filter(x=>x.ok).length;
  $("resPct").textContent=Math.round(r/n*100)+"%";
  $("resTxt").textContent=`${n}문항 중 ${r}문항 정답`;
  const by={};
  run.res.forEach(({q,ok})=>{(by[q.s]=by[q.s]||[0,0]); by[q.s][1]++; if(ok)by[q.s][0]++;});
  $("resTable").innerHTML=Object.keys(SEC).filter(s=>by[s]).map(s=>{const [a,b]=by[s];const c=a===b?"var(--ok)":a/b<.6?"var(--bad)":"var(--ink)";return `<tr><td><span class="tag ${SEC[s][0]}">${SEC[s][1]}</span>${SEC[s][2]}</td><td style="color:${c}">${a} / ${b}</td></tr>`}).join("");
  const wr=run.res.filter(x=>!x.ok);
  $("retryWrong").disabled=!wr.length;
  $("wrongCard").style.display=wr.length?"":"none";
  $("wrongList").innerHTML=wr.map(({q})=>`<div class="wrong"><span class="tag ${SEC[q.s][0]}">${SEC[q.s][1]}</span><div class="wq">${esc(q.q)}</div><div class="wa">정답: ${esc(q.t==="sa"?q.a[0].replace(/^g/,"G"):answerText(q))}</div>${q.e?`<div style="color:var(--sub);margin-top:2px">${esc(q.e)}</div>`:""}</div>`).join("");
}
$("retryWrong").onclick=()=>start(run.res.filter(x=>!x.ok).map(x=>x.q));
$("homeBtn").onclick=()=>{show("home");renderHome()};
$("quitBtn").onclick=()=>{ if(run.res.length) renderResult(); else {show("home");renderHome();} };
$("startBtn").onclick=()=>start(pool());
$("wrongBtn").onclick=()=>start(Q.filter(q=>wrongSet.has(q.id)));
$("resetWrong").onclick=()=>{ if(confirm("오답 기록을 모두 지울까요?")){wrongSet=new Set();saveWrong(wrongSet);renderHome();} };

/* ---------- 테마 ---------- */
$("themeBtn").onclick=()=>{
  const r=document.documentElement, dark=matchMedia("(prefers-color-scheme: dark)").matches;
  const cur=r.dataset.theme||(dark?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";
};
renderHome();
</script>
</body>
</html>
